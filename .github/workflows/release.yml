name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Align working directory with the CI workflow
    defaults:
      run:
        working-directory: ./omniping
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: ./omniping/go.sum
        
    - name: Download Dependencies
      run: go mod download
        
    - name: Run Build Script
      run: chmod +x scripts/build.sh && ./scripts/build.sh
      
    - name: Upload Binary Asset
      uses: actions/upload-artifact@v4
      with:
        name: omniping-binary
        # Ensure the path correctly points to the built binary inside the working directory
        path: ./omniping/bin/omniping
